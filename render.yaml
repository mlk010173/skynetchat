# Blueprint do Render: backend do agente SKYNET (ferramentas, MCP e terminal guardado).
# Frontend na Vercel (skynetchat-xi.vercel.app); dados/IA no Supabase.
# As variaveis sensiveis sao configuradas depois no painel do Render (Environment).
services:
  - type: web
    name: skynet-agent
    runtime: node
    plan: free
    region: oregon
    # o SKYNET COMPUTER precisa do Chromium instalado para controlar um navegador real
    buildCommand: npm install && (npx playwright install chromium --with-deps || npx playwright install chromium)
    startCommand: node server/agent.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
