<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>404 — SKYNETchat</title>
<link rel="icon" href="favicon-32-v2.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #fff;
         font-family: Inter, "Segoe UI", system-ui, sans-serif; text-align: center; padding: 20px; }
  .box { max-width: 520px; }
  .code { font-size: 5.5rem; font-weight: 800; letter-spacing: 0.04em; line-height: 1;
          background: linear-gradient(135deg, #ff0000, #ff5a5a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #a0a0a0; margin: 14px 0 26px; font-size: 1rem; line-height: 1.6; }
  a { display: inline-block; background: #ff0000; color: #fff; text-decoration: none; font-weight: 600;
      padding: 12px 28px; border-radius: 10px; transition: transform 0.15s, box-shadow 0.15s; }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,0,0,0.45); }
  .tag { margin-top: 26px; color: #555; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <p>Esta rota não existe no espelho.<br>O que você procura pode estar no site oficial.</p>
    <a href="/">Voltar ao início</a>
    <div class="tag">SKYNETchat · espelho estático</div>
  </div>
</body>
</html>
