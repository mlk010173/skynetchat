<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Entrar na conta — SKYNETchat</title>
<meta name="description" content="Recuperação de acesso do SKYNETchat.">
<link rel="icon" type="image/png" href="../favicon-32-v2.png">
<link rel="apple-touch-icon" href="../apple-touch-icon-v2.png">
<!-- melhorias sitejack v2 -->
<link rel="stylesheet" href="../melhorias.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --sk-acento: #ff2a2a; }
  body { min-height: 100vh; background: #0a0a0a; color: #fff; display: grid; place-items: center; padding: 24px;
         font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  .topo { position: fixed; top: 18px; left: 22px; font: 700 12px/1 ui-monospace, Consolas, monospace;
          letter-spacing: .28em; color: #888; }
  .topo b { color: var(--sk-acento); }
  .topo .on { color: #ff5a5a; animation: sk-pulsa 2.2s infinite; }
  @keyframes sk-pulsa { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  .slogan { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; font: 600 9.5px/1.7 ui-monospace, monospace;
            letter-spacing: .18em; color: #4a4a4a; padding: 0 20px; }
  .caixa { width: min(460px, 100%); border: 1px solid #262626; border-radius: 14px; padding: 34px 30px;
           background: linear-gradient(180deg, #101010, #0c0c0c); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .rotulo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rotulo .term { font: 800 15px/1 ui-monospace, Consolas, monospace; color: var(--sk-acento); letter-spacing: .06em; }
  .rotulo .seg { font: 700 9px/1 ui-monospace, monospace; letter-spacing: .3em; color: #666;
                 border: 1px solid #333; padding: 4px 8px; border-radius: 4px; }
  h1 { font: 800 20px/1.2 Inter, sans-serif; letter-spacing: .1em; margin-bottom: 10px; }
  p.desc { color: #999; font-size: 13.5px; line-height: 1.7; margin-bottom: 26px; }
  form label { display: block; font: 700 10px/1 ui-monospace, monospace; letter-spacing: .22em; color: #777; margin-bottom: 8px; }
  form input[type="email"] { width: 100%; background: #161616; border: 1px solid #2c2c2c; border-radius: 8px;
    padding: 14px 15px; color: #fff; font: 500 14px Inter, sans-serif; outline: none; transition: border-color .2s, box-shadow .2s; }
  form input[type="email"]:focus { border-color: var(--sk-acento); box-shadow: 0 0 0 3px rgba(255,42,42,.18); }
  .btn { margin-top: 18px; width: 100%; background: linear-gradient(135deg, #ff2a2a, #c40000); border: none; border-radius: 8px;
    padding: 14px; color: #fff; font: 700 12px/1 ui-monospace, monospace; letter-spacing: .24em; cursor: pointer;
    transition: transform .15s, box-shadow .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,42,42,.4); }
  .suporte { margin-top: 20px; text-align: center; font-size: 12.5px; color: #888; }
  .suporte a, .rodape a { color: #bbb; text-decoration: none; transition: color .15s; }
  .suporte a:hover, .rodape a:hover { color: var(--sk-acento); }
  .rodape { margin-top: 24px; padding-top: 18px; border-top: 1px solid #222; display: flex; justify-content: center; gap: 14px;
    font: 600 10.5px/1 ui-monospace, monospace; letter-spacing: .18em; }
  .rodape span { color: #333; }
</style>
</head>
<body>
  <div class="topo"><b>SKYNET</b>CHAT <span class="on">ONLINE</span></div>
  <main class="caixa">
    <div class="rotulo"><span class="term">&gt;_ ACESSO</span><span class="seg">SECURE</span></div>
    <h1>Entrar na conta</h1>
    <p class="desc">Acesse sua conta do SKYNETchat com email e senha.</p>
    <form onsubmit="return false">
      <label for="email">EMAIL</label>
      <input id="email" type="email" placeholder="voce@email.com" autocomplete="email">
      <label for="senha" style="margin-top:14px">SENHA</label>
      <input id="senha" type="password" placeholder="••••••••" autocomplete="current-password" style="width:100%;background:#161616;border:1px solid #2c2c2c;border-radius:8px;padding:14px 15px;color:#fff;font:500 14px Inter,sans-serif;outline:none;transition:border-color .2s,box-shadow .2s">
      <button class="btn" type="submit">ENTRAR</button>
    </form>
    <p class="suporte">Esqueceu a senha? <a href="../recovery/">Recuperar acesso</a></p>
    <nav class="rodape"><a href="../recovery/">RECUPERAR</a><span>|</span><a href="../sign-up/">CRIAR CONTA</a></nav>
  </main>
  <p class="slogan">O DIREITO À PRIVACIDADE E O ACESSO IRRESTRITO À INFORMAÇÃO É UM DIREITO UNIVERSAL DE TODOS.</p>
  <script defer src="../melhorias.js"></script>
</body>
</html>
