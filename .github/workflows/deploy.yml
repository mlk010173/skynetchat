name: Validar e Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sintaxe dos arquivos JS da camada
        run: for f in melhorias.js $(find . -name "*.js" -path "./dev-api/*"); do node --check "$f"; done
      - name: Checar links internos (nenhum href/src pode apontar pra arquivo inexistente)
        run: |
          python3 - << 'PY'
          import re, os, urllib.parse
          problemas = []
          for root, _, fs in os.walk('.'):
              if '.git' in root: continue
              for f in fs:
                  if not f.endswith(('.html', '.js')): continue
                  p = os.path.relpath(os.path.join(root, f), '.')
                  base = os.path.dirname(p)
                  for m in re.finditer(r'(?:href|src)\s*=\s*["\']([^"\'#]+)["\']', open(p, encoding='utf-8', errors='ignore').read()):
                      u = m.group(1)
                      if u.startswith(('http', 'data:', 'mailto:', 'javascript:', 'blob:', '//', '$', 'about:')): continue
                      u = u.split('?')[0].split('#')[0]
                      if not u: continue
                      r = u.lstrip('/') if u.startswith('/') else os.path.normpath(os.path.join(base, u))
                      r = urllib.parse.unquote(r)
                      if '$' in r or r.startswith('_app/immutable/chunks/'): continue
                      alvo = r if u.startswith('/') else r
                      caminho = alvo if os.path.exists(alvo) else os.path.join(alvo, 'index.html')
                      if not (os.path.isfile(alvo) and not alvo.endswith('/') or os.path.exists(caminho)):
                          pass
                      existe = os.path.isfile(alvo) or os.path.exists(os.path.join(alvo, 'index.html')) or os.path.isfile(os.path.join(alvo, 'index.html'))
                      if not existe and not os.path.isfile(alvo):
                          problemas.append(p + ' -> ' + u)
          if problemas:
              print('\n'.join(problemas[:40])); print('TOTAL QUEBRADOS:', len(problemas)); raise SystemExit(1)
          print('links internos OK')
          PY
      - name: Verificar integridade SHA-1 de todos os arquivos
        run: |
          python3 - << 'PY'
          import hashlib, json, sys, os
          m = json.load(open("manifest.json"))
          arqs = m["arquivos"]
          falhas = []
          for caminho, esperado in sorted(arqs.items()):
              if not os.path.exists(caminho):
                  falhas.append(f"FALTANDO: {caminho}")
                  continue
              real = hashlib.sha1(open(caminho, "rb").read()).hexdigest()
              if real != esperado:
                  falhas.append(f"ALTERADO: {caminho}")
          print(f"{len(arqs)} arquivos verificáveis, {len(falhas)} falhas")
          if falhas:
              print("\n".join(falhas))
              sys.exit(1)
          print("INTEGRIDADE OK — clone fiel byte a byte")
          PY
  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
