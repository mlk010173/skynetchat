name: Android APK

# Gera o APK do SKYNET (modo app) e publica em Releases.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Versão do app
        id: versao
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts | head -1)
          C=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' android/app/build.gradle.kts | head -1)
          echo "nome=${V:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "codigo=${C:-1}" >> "$GITHUB_OUTPUT"
          echo "tag=android-v${V:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Assinatura (quando existe keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "keystore presente: build release assinado"
          else
            echo "sem keystore: build debug (instalável, assinatura de debug)"
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../skynet.apk || cp app/build/outputs/apk/release/*.apk ../skynet.apk
          else
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../skynet.apk || cp app/build/outputs/apk/debug/*.apk ../skynet.apk
          fi
          ls -la ../skynet.apk

      - name: Nome do arquivo
        id: apk
        run: |
          NOME="skynet-${{ steps.versao.outputs.nome }}.apk"
          mv skynet.apk "$NOME"
          echo "arquivo=$NOME" >> "$GITHUB_OUTPUT"
          echo "tamanho=$(du -h "$NOME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: skynet-apk
          path: ${{ steps.apk.outputs.arquivo }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: "SKYNET app ${{ steps.versao.outputs.nome }}"
          body: |
            SKYNET em modo app (Android).

            - Pacote: ai.skynet.chat
            - Site base: https://mlk010173.github.io/skynetchat/
            - Tamanho: ${{ steps.apk.outputs.tamanho }}

            Instalação: baixe o APK abaixo e abra no celular (permita "instalar de fontes desconhecidas").
          files: ${{ steps.apk.outputs.arquivo }}
          overwrite_files: true
