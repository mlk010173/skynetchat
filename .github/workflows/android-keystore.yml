name: Android keystore (uma vez)

# Gera o keystore de assinatura e publica como artefato.
# Rode uma vez, baixe o artefato e salve como secret KEYSTORE_BASE64.
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Criar keystore
        run: |
          keytool -genkeypair -v \
            -keystore skynet.keystore -alias skynet \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'skynet2026' }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD || 'skynet2026' }}" \
            -dname "CN=SKYNET, OU=Nico, O=SKYNET, L=Sao Paulo, ST=SP, C=BR"
          base64 -w0 skynet.keystore > keystore.b64
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            skynet.keystore
            keystore.b64
          retention-days: 30
