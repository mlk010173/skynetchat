<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // tema escolhido pelo usuário vale já na primeira pintura (evita flash e perda ao recarregar)
      (function () {
        try {
          var salvo = localStorage.getItem("skynet-theme-bg");
          var tema = salvo === "white" ? "white" : "black";
          document.documentElement.dataset.theme = tema;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", tema === "white" ? "#f7f7f8" : "#0a0a0a");
        } catch (e) {
          document.documentElement.dataset.theme = "black";
        }
      })();
    </script>
    <title>SKYNETchat — Inteligência Artificial Operacional</title>
