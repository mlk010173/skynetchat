<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYNETchat</title>
<style>
  html,body{background:#070000;color:#fff;margin:0;height:100%;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .cx{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:420px;text-align:center}
  .card h1{font-size:18px;font-weight:600;margin:0 0 8px}
  .card p{color:#9a9a9a;margin:0 0 18px}
  .card a{display:inline-block;padding:10px 18px;border-radius:10px;background:#2ea043;color:#fff;text-decoration:none;font-weight:600}
</style>
<script>
/* O GitHub Pages nao tem rewrite: qualquer rota dinamica (/chat/<id>) cai aqui.
   Reencaminha para a pagina estatica equivalente preservando o identificador. */
(function () {
  var p = location.pathname || "/";
  var m = p.match(/^\/(skynetchat-frontend|skynetchat)(?=\/|$)/);
  var base = m ? "/" + m[1] : "";
  var resto = p.slice(base.length) || "/";
  var busca = location.search || "";
  var alvo = base + "/";
  var chat = resto.match(/^\/chat\/([^\/?#]+)/);
  if (chat) {
    var id = chat[1];
    var extra = busca && busca !== "?" ? "&" + busca.slice(1) : "";
    alvo = base + "/chat/?conv=" + encodeURIComponent(id) + extra;
  } else if (/^\/(about|login|novo|voz|v3|politicos|monetize|checkout|afiliado|affiliate-panel|indique-ganhe|recovery|sign-up|termos|dev-panel|dev\/security)\/?$/.test(resto)) {
    alvo = base + resto.replace(/\/?$/, "/") + busca;
  } else if (/^\/docs(\/|$)/.test(resto)) {
    alvo = base + resto.replace(/\/?$/, "/") + busca;
  }
  try { location.replace(alvo); } catch (e) { location.href = alvo; }
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.getElementById("ir");
    if (a) a.href = alvo;
  });
})();
</script>
</head>
<body>
  <div class="cx">
    <div class="card">
      <h1>Essa página não existe por aqui</h1>
      <p>Estamos te levando para o lugar certo no SKYNETchat.</p>
      <a id="ir" href="/">Continuar</a>
    </div>
  </div>
</body>
</html>
