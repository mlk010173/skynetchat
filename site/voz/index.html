<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio de Voz — SKYNETchat</title>
<style>
  :root { --bg:#0a0a0a; --card:#121212; --line:#242424; --txt:#ececec; --dim:#8b8b8b; --ac:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { color:#9cc4ff; text-decoration:none; }
  .topo { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(10,10,10,.92); backdrop-filter:blur(8px); z-index:5; }
  .topo strong { font-size:15px; letter-spacing:.2px; }
  .topo .tag { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .wrap { max-width:840px; margin:0 auto; padding:22px 18px 140px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
  .linha { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:6px; letter-spacing:.03em; text-transform:uppercase; }
  select, input[type=range] { width:100%; }
  select { background:#0f0f0f; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:14px; }
  .col { flex:1 1 180px; min-width:150px; }
  .palco { display:flex; flex-direction:column; align-items:center; gap:16px; padding:26px 18px; }
  .mic { width:104px; height:104px; border-radius:50%; border:1px solid #2b2b2b; background:radial-gradient(circle at 50% 35%,#1d1d1d,#0e0e0e); color:#eaeaea; font-size:34px; cursor:pointer; display:grid; place-items:center; transition:transform .12s ease, box-shadow .2s ease, border-color .2s; }
  .mic:hover { transform:translateY(-1px); border-color:#3a3a3a; }
  .mic.on { border-color:#ef4444; box-shadow:0 0 0 10px rgba(239,68,68,.12); color:#ff8080; }
  .barras { display:flex; gap:4px; height:34px; align-items:flex-end; }
  .barras i { display:block; width:4px; height:6px; border-radius:2px; background:#2f6fe0; transition:height .1s linear; }
  .status { font-size:12.5px; color:var(--dim); text-align:center; min-height:18px; }
  .balao { border-radius:14px; padding:11px 14px; margin-bottom:10px; white-space:pre-wrap; word-break:break-word; font-size:14.5px; }
  .balao.eu { background:#14304f; border:1px solid #1e4a7a; align-self:flex-end; }
  .balao.sky { background:#151515; border:1px solid #262626; }
  .fala { display:flex; flex-direction:column; }
  .bt { border:1px solid #2b2b2b; background:#171717; color:#e8e8e8; border-radius:10px; padding:9px 14px; font-size:13.5px; cursor:pointer; }
  .bt:hover { background:#1e1e1e; }
  .bt.prim { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  textarea { width:100%; min-height:74px; background:#0f0f0f; border:1px solid var(--line); border-radius:12px; color:var(--txt); padding:11px 12px; font:14.5px/1.5 inherit; resize:vertical; }
  .rodape { position:fixed; left:0; right:0; bottom:0; padding:12px 18px; background:linear-gradient(to top,rgba(10,10,10,.98),rgba(10,10,10,.7)); border-top:1px solid var(--line); }
  .rodape .in { max-width:840px; margin:0 auto; display:flex; gap:10px; }
  .rodape textarea { min-height:44px; height:44px; }
  .mini { font-size:11.5px; color:#6f6f6f; }
</style>
</head>
<body>
<div class="topo">
  <strong>Studio de Voz</strong>
  <span class="tag">open-source · roda no seu navegador</span>
  <span style="flex:1"></span>
  <a href="/chat/">Ir para o chat →</a>
</div>

<div class="wrap">
  <div class="card">
    <div class="linha">
      <div class="col">
        <label>Motor de voz</label>
        <select id="motor">
          <option value="neuronal">Neural open-source (MMS-TTS pt-BR)</option>
          <option value="sistema">Voz do sistema (mais leve)</option>
        </select>
      </div>
      <div class="col">
        <label>Velocidade <span id="velV" class="mini">1,0x</span></label>
        <input id="vel" type="range" min="0.7" max="1.4" step="0.05" value="1" />
      </div>
      <div class="col">
        <label>Volume <span id="volV" class="mini">100%</span></label>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="1" />
      </div>
    </div>
    <p class="mini" style="margin:12px 0 0">A voz neural usa o modelo aberto <b>MMS-TTS</b> (Meta, licença CC-BY-NC) baixado uma vez pelo navegador. Se o download falhar, a voz do sistema assume automaticamente.</p>
  </div>

  <div class="card palco">
    <button id="mic" class="mic" title="Falar">🎙</button>
    <div class="barras" id="barras"></div>
    <div class="status" id="status">Toque no microfone e fale em português.</div>
  </div>

  <div class="card fala" id="fala"></div>
</div>

<div class="rodape">
  <div class="in">
    <textarea id="txt" placeholder="Ou escreva aqui e aperte Falar…"></textarea>
    <button class="bt prim" id="enviar">Enviar</button>
    <button class="bt" id="parar">Parar</button>
  </div>
</div>

<script src="/demo/live-config.js?v=1"></script>
<script src="/demo/voz.js?v=2"></script>
<script>
(function () {
  var motor = document.getElementById("motor"), vel = document.getElementById("vel"), vol = document.getElementById("vol");
  var mic = document.getElementById("mic"), status = document.getElementById("status"), fala = document.getElementById("fala");
  var txt = document.getElementById("txt"), barras = document.getElementById("barras");
  var rec = null, ouvindo = false, ultimo = "";
  var V = window.SKYVoz;

  for (var i = 0; i < 24; i++) barras.appendChild(document.createElement("i"));
  var tique = null;
  window.__skyVozBars = function (ativo) {
    var hastes = barras.querySelectorAll("i");
    if (tique) { clearInterval(tique); tique = null; }
    if (!ativo) { hastes.forEach(function (h) { h.style.height = "6px"; }); return; }
    tique = setInterval(function () {
      hastes.forEach(function (h) { h.style.height = (6 + Math.random() * 26) + "px"; });
    }, 90);
  };

  motor.onchange = function () { V.motor = motor.value; };
  var velV = document.getElementById("velV"), volV = document.getElementById("volV");
  vel.oninput = function () { velV.textContent = Number(vel.value).toFixed(1).replace(".", ",") + "x"; };
  vol.oninput = function () { volV.textContent = Math.round(vol.value * 100) + "%"; };

  function opcoes() { return { motor: motor.value, velocidade: Number(vel.value), volume: Number(vol.value) }; }

  function balao(quem, texto) {
    var b = document.createElement("div");
    b.className = "balao " + (quem === "eu" ? "eu" : "sky");
    b.textContent = texto;
    fala.appendChild(b);
    b.scrollIntoView({ block: "end", behavior: "smooth" });
    return b;
  }

  function situacao(t) { status.textContent = t; }

  if (!V.suportaMicrofone()) {
    situacao("Seu navegador não faz reconhecimento de voz. Escreva no campo abaixo que eu falo a resposta.");
    mic.disabled = true; mic.style.opacity = ".45";
  }

  mic.onclick = function () {
    if (ouvindo) { try { rec && rec.stop(); } catch (e) {} ouvindo = false; mic.classList.remove("on"); return; }
    V.parar();
    ouvindo = true; mic.classList.add("on"); ultimo = "";
    situacao("Ouvindo… fale agora.");
    rec = V.ouvir({
      continuo: false,
      onTexto: function (parcial, final) {
        if (parcial) situacao(parcial);
        if (final) { ultimo = final; situacao("Você disse: " + final); }
      },
      onErro: function (e) { situacao(e === "not-allowed" ? "Permita o microfone no navegador." : "Erro no microfone: " + e); },
      onFim: function () {
        ouvindo = false; mic.classList.remove("on");
        if (ultimo) { txt.value = ultimo; enviar(); }
        else if (status.textContent === "Ouvindo… fale agora.") situacao("Não entendi nada. Tente de novo.");
      }
    });
    if (!rec) { ouvindo = false; mic.classList.remove("on"); situacao("Não consegui abrir o microfone."); }
  };

  async function enviar() {
    var texto = (txt.value || "").trim();
    if (!texto) return;
    txt.value = "";
    balao("eu", texto);
    var alvo = balao("sky", "…");
    situacao("Pensando…");
    try {
      var resposta = await V.conversar(texto, { onDelta: function (parcial) { alvo.textContent = parcial; } });
      if (!resposta) { alvo.textContent = "O servidor respondeu vazio."; situacao(""); return; }
      alvo.textContent = resposta;
      situacao("Falando a resposta…");
      await V.falar(resposta, Object.assign(opcoes(), {
        onProgresso: function (p) { situacao("Carregando a voz neural… " + p + "%"); }
      }));
      situacao("Pronto. Toque no microfone para continuar.");
    } catch (e) {
      alvo.textContent = "Falhou: " + (e && e.message ? e.message : "erro");
      situacao("Deu erro ao falar com o servidor.");
    }
  }

  document.getElementById("enviar").onclick = enviar;
  document.getElementById("parar").onclick = function () { V.parar(); situacao("Parado."); };
  txt.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); enviar(); }
  });
})();
</script>
</body>
</html>
